name: Android build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Accept Android licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show the error summary
        if: failure()
        run: |
          echo "=========== WHAT WENT WRONG ==========="
          grep -n -A 25 "What went wrong" build.log | head -80
          echo "=========== COULD NOT LINES ==========="
          grep -n "Could not\|error:\|e: " build.log | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: smartlife-stark-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
